name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - run: ./scripts/release.sh
        env:
          VERSION: ${{ github.ref_name }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made in the GitHub web UI also pushes the tag. Then the release exists:
        # add the files and keep its title and notes.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          elif ! gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag; then
            # The release was made while this job ran.
            gh release view "$GITHUB_REF_NAME" >/dev/null
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          fi
